# Tiny Tapeout project information
project:
  title:        "8-bit Custom CPU"
  author:       "theovolt"
  discord:      ""
  description:  "An 8-bit Von Neumann CPU with signed ALU, 16-byte RAM, Live and Program modes"
  language:     "SystemVerilog"
  clock_hz:     50000000

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_theovoltsis_cpu"

  # List your project's source files here.
  source_files:
    - "tt_um_theovoltsis_cpu.sv"
    - "controler.sv"
    - "alu.sv"
    - "ram.sv"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  # Inputs (ui_in)
  ui[0]: "sw_data[0] / sw_addr[0]"
  ui[1]: "sw_data[1] / sw_addr[1]"
  ui[2]: "sw_data[2] / sw_addr[2]"
  ui[3]: "sw_data[3] / sw_addr[3]"
  ui[4]: "sw_data[4]"
  ui[5]: "sw_data[5]"
  ui[6]: "sw_data[6]"
  ui[7]: "sw_data[7]"

  # Outputs (uo_out)
  uo[0]: "Accumulator bit 0"
  uo[1]: "Accumulator bit 1"
  uo[2]: "Accumulator bit 2"
  uo[3]: "Accumulator bit 3"
  uo[4]: "Accumulator bit 4"
  uo[5]: "Accumulator bit 5"
  uo[6]: "Accumulator bit 6"
  uo[7]: "Accumulator bit 7"

  # Bidirectional pins (uio)
  uio[0]: "Live Mode (Input: 1=Live, 0=RAM)"
  uio[1]: ""
  uio[2]: ""
  uio[3]: "Opcode bit 0 (Input)"
  uio[4]: "Opcode bit 1 (Input)"
  uio[5]: "Opcode bit 2 (Input)"
  uio[6]: "Opcode bit 3 (Input)"
  uio[7]: "Overflow Flag (Output)"

# Do not change!
yaml_version: 6
